databases:
  - name: elite-rewards-db
    plan: free
    databaseName: elite_rewards
    user: elite_rewards

services:
  - type: web
    name: elite-rewards
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci --include=dev && npm run check
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
      - key: NITRO_PRESET
        value: render_com
      - key: DATABASE_URL
        fromDatabase:
          name: elite-rewards-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: SETUP_TOKEN
        generateValue: true
